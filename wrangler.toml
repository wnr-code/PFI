name = "pfi"
main = "worker/index.js"
compatibility_date = "2026-11-19"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "falaq"
database_name = "pfi-falaq"
database_id = "0ae91ae2-8bec-474f-b72d-1b793f951d4a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "r2falaq"
bucket_name = "pfi-falaq-r2"

# Preview D1 akan diarahkan ke database donate setelah database_id dikonfirmasi.
# Jangan isi database_id dengan ID perkiraan karena dapat menghubungkan database yang salah.
[previews]

[[previews.d1_databases]]
binding = "falaq"
database_name = "pfi-falaq"
database_id = "0ae91ae2-8bec-474f-b72d-1b793f951d4a"

# Preview memakai bucket R2 forumcgs.
# Pastikan bucket ini memang bucket yang ditujukan untuk data Preview.
[[previews.r2_buckets]]
binding = "r2falaq"
bucket_name = "forumcgs"

# Set these as Worker secrets/vars in Cloudflare Dashboard, not as VITE_*
# frontend values. SUPABASE_ANON_KEY is a public/publishable key but is kept
# server-side here so the Worker can validate access tokens with Supabase Auth.
# SUPABASE_URL
# SUPABASE_ANON_KEY
