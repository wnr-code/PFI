# Cloudflare Pages + Workers configuration for PFI (Pusat Falak Indonesia)
# D1 Database: pfi-falaq
# R2 Bucket: pfi-falaq-r2

name = "pfi"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages project settings
[pages]
# Build command untuk Pages
build_command = "npm run build"
# Output folder dari esbuild build
build_output_dir = "dist"

# D1 database binding
[[d1_databases]]
binding = "falaq"          # Nama variabel di Worker: env.falaq
database_name = "pfi-falaq"
database_id = "0ae91ae2-8bec-474f-b72d-1b793f951d4a"  # Disederhanakan dari dashboard Cloudflare Anda

# R2 bucket binding
[[r2_buckets]]
binding = "r2falaq"        # Nama variabel di Worker: env.r2falaq
bucket_name = "pfi-falaq-r2"

# Environment variables (bisa di-override di Cloudflare Dashboard)
[vars]
VITE_SUPABASE_URL = "https://boennhvuoptogvcocbpx.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_hM2Sdb3-WgLzc6-tgKc9Yg_wRyEHMtW"
VITE_API_URL = "https://pfi.cgs.my.id"