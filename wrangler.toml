# Dibuat/diperbarui: 2026-11-19
# Dibuat oleh: AEP
# GitHub: https://github.com/wnr-code/PFI
# Maintainer: @wnr-code — https://github.com/wnr-code
# Dukung pengembang: https://trakteer.id/lanteraku/tip

name = "pfi"
main = "worker/index.js"
compatibility_date = "2026-11-19"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "falaq"
database_name = "pfi-falaq"
database_id = "0ae91ae2-8bec-474f-b72d-1b793f951d4a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "r2falaq"
bucket_name = "pfi-falaq-r2"

# Supabase dipakai hanya untuk validasi identitas Google. URL dan publishable key
# memang bersifat publik; tidak ada service-role key atau akses data aplikasi.
[vars]
SUPABASE_URL = "https://boennhvuoptogvcocbpx.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_hM2Sdb3-WgLzc6-tgKc9Yg_wRyEHMtW"

[previews]
[[previews.d1_databases]]
binding = "falaq"
database_name = "sanbok-pfi"
database_id = "b43a00c7-7ba9-4b9a-95be-a2770ab8e3ae"

# Preview memakai bucket R2 forumcgs.
[[previews.r2_buckets]]
binding = "r2falaq"
bucket_name = "forumcgs"

# SUPABASE_URL dan SUPABASE_ANON_KEY harus disetel sebagai Worker secrets/vars
# pada Cloudflare Dashboard untuk Production dan Preview.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
