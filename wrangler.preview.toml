name = "pfi-preview"
main = "worker/index.js"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "falaq"
database_name = "sanbok-pfi"
database_id = "b43a00c7-7ba9-4b9a-95be-a2770ab8e3ae"

[[r2_buckets]]
binding = "r2falaq"
bucket_name = "forumcgs"
