# Publikasi Production hanya melalui konfirmasi manual agar Preview dan Production tetap terpisah.
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Ketik tepat: DEPLOY-PRODUCTION-pfi.cgs.my.id"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pfi-production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ inputs.confirm_production == 'DEPLOY-PRODUCTION-pfi.cgs.my.id' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout approved main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete validation
        run: npm run test:all

      - name: Build Production assets
        run: npm run build

      - name: Validate Production bindings
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'database_name = "pfi-falaq"' wrangler.toml
          grep -q 'database_id = "0ae91ae2-8bec-474f-b72d-1b793f951d4a"' wrangler.toml
          grep -q 'bucket_name = "pfi-falaq-r2"' wrangler.toml

      - name: Deploy Worker and assets to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 deploy
