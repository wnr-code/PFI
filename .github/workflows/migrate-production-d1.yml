name: Apply Production D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirm_database:
        description: "Ketik tepat: APPLY-PRODUCTION-pfi-falaq"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pfi-production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-production:
    if: ${{ inputs.confirm_database == 'APPLY-PRODUCTION-pfi-falaq' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout migration files
        uses: actions/checkout@v4
        with:
          ref: preview/workers-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Production-only configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'database_name = "pfi-falaq"' wrangler.production-migrations.toml
          grep -q 'database_id = "0ae91ae2-8bec-474f-b72d-1b793f951d4a"' wrangler.production-migrations.toml
          if grep -q 'b43a00c7-7ba9-4b9a-95be-a2770ab8e3ae' wrangler.production-migrations.toml; then
            echo "Preview database ID found in Production migration config; stopping."
            exit 1
          fi

      - name: Repair legacy Production schema columns if needed
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.165.0 d1 execute PRODUCTION_DB --remote --config wrangler.production-migrations.toml"

          TABLES="$($WRANGLER --command='PRAGMA table_list' --json)"

          if echo "$TABLES" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"agendas"'; then
            COLUMNS="$($WRANGLER --command='PRAGMA table_info("agendas")' --json)"
            if ! echo "$COLUMNS" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"date"'; then
              echo "Adding missing agendas.date column."
              $WRANGLER --command="ALTER TABLE agendas ADD COLUMN date TEXT NOT NULL DEFAULT ''" --yes
            fi
          fi

          if echo "$TABLES" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"groups"'; then
            COLUMNS="$($WRANGLER --command='PRAGMA table_info("groups")' --json)"
            if ! echo "$COLUMNS" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"name"'; then
              echo "Adding missing groups.name column."
              $WRANGLER --command="ALTER TABLE groups ADD COLUMN name TEXT NOT NULL DEFAULT ''" --yes
            fi
            if ! echo "$COLUMNS" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"description"'; then
              echo "Adding missing groups.description column."
              $WRANGLER --command="ALTER TABLE groups ADD COLUMN description TEXT NOT NULL DEFAULT ''" --yes
            fi
            if ! echo "$COLUMNS" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"created"'; then
              echo "Adding missing groups.created column."
              $WRANGLER --command="ALTER TABLE groups ADD COLUMN created TEXT NOT NULL DEFAULT ''" --yes
            fi
          fi

          if echo "$TABLES" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"groups"'; then
            $WRANGLER --command="UPDATE groups SET name = CASE id WHEN 'nusantara' THEN 'Jaringan Nusantara' WHEN 'kelas-falak' THEN 'Kelas Falak' WHEN 'lab-hisab' THEN 'Lab Hisab' ELSE name END WHERE id IN ('nusantara','kelas-falak','lab-hisab') AND (name IS NULL OR name = '')" --yes
          fi

          echo "Legacy schema compatibility checks completed."
          
      - name: Show pending Production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 d1 migrations list PRODUCTION_DB --remote --config wrangler.production-migrations.toml

      - name: Apply migrations to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 d1 migrations apply PRODUCTION_DB --remote --config wrangler.production-migrations.toml

      - name: Verify Production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 d1 migrations list PRODUCTION_DB --remote --config wrangler.production-migrations.toml
