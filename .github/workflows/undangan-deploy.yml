# Publikasi undangan hanya lewat konfirmasi manual.
name: Deploy Undangan

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Ketik tepat: DEPLOY-undangan-jafar-iklimah"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: undangan-deployment
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.165.0

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY-undangan-jafar-iklimah' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: undangan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tes
        run: node --test tests/*.test.mjs

      - name: Tolak database_id placeholder
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "database_id di undangan/wrangler.toml masih placeholder."
            echo "Jalankan: npx wrangler d1 create undangan-jafar-iklimah lalu tempel ID-nya."
            exit 1
          fi

      - name: Terapkan migrasi D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER d1 migrations apply undangan-jafar-iklimah --remote

      - name: Deploy Worker + aset
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: $WRANGLER deploy
