name: Apply Preview D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirm_database:
        description: "Ketik tepat: sanbok-pfi"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pfi-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    if: ${{ inputs.confirm_database == 'sanbok-pfi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview/workers-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Preview-only configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'database_name = "sanbok-pfi"' wrangler.preview-migrations.toml
          grep -q 'database_id = "b43a00c7-7ba9-4b9a-95be-a2770ab8e3ae"' wrangler.preview-migrations.toml
          if grep -q '0ae91ae2-8bec-474f-b72d-1b793f951d4a' wrangler.preview-migrations.toml; then
            echo "Production database ID found in Preview migration config; stopping."
            exit 1
          fi

      - name: Show pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.toml

      - name: Apply migrations to Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.toml

      - name: Verify applied migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.toml
