# weding-java — tes API undangan & validasi konfigurasi Cloudflare.
name: weding-java checks

on:
  push:
    paths:
      - 'weding-java/**'
      - '.github/workflows/weding-java-checks.yml'
  pull_request:
    paths:
      - 'weding-java/**'
      - '.github/workflows/weding-java-checks.yml'

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: weding-java
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test validasi & API ucapan
        run: node --test tests/*.test.mjs

      - name: Validasi konfigurasi Worker (dry run)
        run: npx --yes wrangler@4.165.0 deploy --dry-run
